<title>Cocktails &amp; Candor</title>

<meta name="description" content="Cocktails & Candor: craft cocktails and straight talk. A podcast from Tampa Bay. Coming soon.">

<style>
/* One screen: the seal, one line, the channels. Dark by design. */
:root{
  --bg:#0A0A0A; --bone:#ECE6DA; --muted:#ABA393; --line:#34302B; --dash:#6E675C;
  --display:'Anton','Impact','Arial Narrow Bold',sans-serif;
  --type:'Special Elite','American Typewriter','Courier New',monospace;
  --body:'Helvetica Neue',Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--bone);font-family:var(--body);-webkit-font-smoothing:antialiased}
.page{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px;text-align:center;
  padding-block:48px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.seal{width:min(400px,78vw);aspect-ratio:1;max-width:100%;color:var(--bone)}
.seal svg{width:100%;height:100%}
.kicker{font-family:var(--type);font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin:0}
h1{font-family:var(--display);font-weight:400;text-transform:uppercase;font-size:clamp(40px,7vw,72px);line-height:1;margin:10px 0 0;letter-spacing:.01em}
.rule{width:min(420px,80vw);height:1.5px;background-image:repeating-linear-gradient(90deg,var(--dash) 0 6px,transparent 6px 10px)}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;list-style:none;margin:0;padding:0}
.links a{display:inline-flex;align-items:center;min-height:48px;padding:0 20px;border:1.5px solid var(--bone);color:var(--bone);text-decoration:none;
  font-family:var(--type);font-size:14px;letter-spacing:.14em;text-transform:uppercase}
.links a:hover,.links a:focus-visible{background:var(--bone);color:var(--bg);outline:none}
.mail{font-family:var(--type);font-size:15px;letter-spacing:.08em;color:var(--muted);margin:0;user-select:all}
.mail a{color:var(--bone);text-decoration:none;border-bottom:1px dashed var(--dash)}
footer{font-size:12.5px;color:var(--muted);line-height:1.6}
</style>
</head>
